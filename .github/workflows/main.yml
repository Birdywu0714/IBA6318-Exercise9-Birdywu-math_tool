name: Python Project CI  # 流水线的名称

on: [push]  # 触发条件：只要有代码提交（push），就运行此流水线

jobs:
  build-and-test:  # 任务 ID
    runs-on: ubuntu-latest  # 在最新版的 Ubuntu 虚拟机上运行

    steps:
    - name: Checkout code
      uses: actions/checkout@v3  # 第一步：把你的代码从仓库下载到虚拟机里

    - name: Set up Python
      uses: actions/setup-python@v4  # 第二步：在虚拟机里安装 Python 环境
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt  # 第三步：安装 requirements.txt 里的 pytest 工具

    - name: Run tests with pytest
      run: |
        pytest test_math_tool.py  # 第四步：运行测试脚本，检查业务逻辑是否正确
